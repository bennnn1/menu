<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dining Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #1a1a1a;
      color: #111111;
    }

    /* Font size for the menu text. The script below shrinks this
       automatically if a week's menu doesn't fit on the screen. */
    :root { --fs: 22px; }

    .screen-container {
      width: 100%;
      height: 100%;
      padding: 0.5rem 1rem;
      background: #f4f4f9 url('background.png') no-repeat center center / cover;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* TOP HEADER */
    .header-bar {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.3rem;
    }

    .meta-box {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #2c3e50;
      border-radius: 8px;
      padding: 0.3rem 0.8rem;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }
    .meta-box.date-range { font-size: 1.2rem; font-weight: 700; color: #2c3e50; }
    .meta-box.week-info  { font-size: 1.4rem; font-weight: 800; color: #b71c1c; }
    .meta-box.cycle-info { font-size: 1.2rem; font-weight: 700; color: #2c3e50; }

    /* MENU TABLE */
    .menu-table {
      width: 100%;
      flex: 1 1 auto;
      border-collapse: separate;
      border-spacing: 4px;
      table-layout: fixed;
    }

    .menu-table th, .menu-table td {
      background: rgba(255, 255, 255, 0.96);
      border: 2px solid #cccccc;
      border-radius: 6px;
      padding: 0.3em 0.4em;
    }

    /* DAY HEADERS */
    .day-header {
      text-align: center;
      vertical-align: middle;
      font-weight: 800;
      font-size: calc(var(--fs) * 1.05);
      background: #2c3e50 !important;
      color: #ffffff;
      padding: 0.25em 0.4em !important;
    }

    /* SIDEWAYS MEAL LABELS (small, so the breakfast row stays short) */
    .meal-header {
      width: 2.2em;
      text-align: center;
      vertical-align: middle;
      background: #34495e !important;
      color: #ffffff;
      font-weight: 800;
      font-size: calc(var(--fs) * 0.6);
      letter-spacing: 0.08em;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      padding: 0.3em 0 !important;
    }

    /* MENU CELLS: items centered, one per line */
    .meal-cell {
      font-size: var(--fs);
      font-weight: 600;
      line-height: 1.2;
      color: #111111;
      text-align: center;
      vertical-align: middle;
      overflow: hidden;
    }
    .meal-cell .item { padding: 0.05em 0; }

    .heart-symbol {
      color: #e74c3c;
      font-weight: bold;
    }

    .holiday-gif {
      display: block;
      margin: 0 auto 4px;
      height: 1.4em;
      object-fit: contain;
    }

    /* TODAY HIGHLIGHT */
    .is-today {
      border: 4px solid #f39c12 !important;
      box-shadow: 0 0 14px rgba(243, 156, 18, 0.7);
      background: #fffdf2 !important;
    }
    th.is-today {
      background: #f39c12 !important;
      color: #ffffff;
    }

    /* BOTTOM NOTES */
    .notes-cell {
      font-size: calc(var(--fs) * 0.6);
      line-height: 1.2;
      background: rgba(236, 240, 241, 0.98) !important;
      color: #222222;
      font-weight: 500;
      text-align: center;
      vertical-align: middle;
    }
    .spacer-cell { background: transparent !important; border: none !important; }

    /* PROGRESS BAR */
    #progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.3);
    }
    #progress-bar {
      height: 100%;
      width: 100%;
      background: #e74c3c;
    }

    /* FULL-SCREEN NOTE FRAME */
    #note-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 100;
    }
    #note-screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="screen-container" id="screen">

  <div class="header-bar" id="header-bar">
    <div class="meta-box date-range" id="date-display"></div>
    <div class="meta-box week-info" id="week-display">Loading...</div>
    <div class="meta-box cycle-info" id="cycle-display">Fall / Winter Menu</div>
  </div>

  <table class="menu-table" id="menu-table">
    <thead id="menu-head"></thead>
    <tbody id="menu-body"></tbody>
  </table>

  <div id="progress-container"><div id="progress-bar"></div></div>
</div>

<!-- Full-screen frame shown between menu rotations -->
<div id="note-screen"><img id="note-img" src="note.png" alt=""></div>

<script>
  // ---------------- SETTINGS ----------------
  const MENU_SECONDS = 45;   // how long the menu stays on screen
  const NOTE_SECONDS = 15;   // how long note.png stays on screen
  const CYCLE_ANCHOR = '2026-01-04'; // a Sunday that is the start of Week 1
  const CYCLE_LENGTH = 4;    // number of weeks in the rotation

  const DAYS = [
    ['Sun', 'Sunday'], ['Mon', 'Monday'], ['Tue', 'Tuesday'], ['Wed', 'Wednesday'],
    ['Thu', 'Thursday'], ['Fri', 'Friday'], ['Sat', 'Saturday']
  ];
  const MEALS = ['Breakfast', 'Lunch', 'Dinner'];

  // ---------------- BUILD THE TABLE ONCE ----------------
  function buildTable() {
    let head = '<tr><th class="spacer-cell" style="width:2.2em"></th>';
    DAYS.forEach(([key, name]) => { head += `<th class="day-header" id="col-${key}">${name}</th>`; });
    head += '</tr>';
    document.getElementById('menu-head').innerHTML = head;

    let body = '';
    MEALS.forEach(meal => {
      body += `<tr><td class="meal-header">${meal.toUpperCase()}</td>`;
      DAYS.forEach(([key]) => { body += `<td class="meal-cell" id="cell-${key}-${meal}"></td>`; });
      body += '</tr>';
    });
    body += `
      <tr>
        <td class="spacer-cell"></td>
        <td colspan="3" class="notes-cell">Tossed Side Salad, Mashed Potato or Mashed Sweet Potato (Check Menu Jacket for Availability), Potato Chips, Pretzels, and Carrot Sticks are always available to accompany any lunch entr&eacute;e.</td>
        <td colspan="2" class="notes-cell"><span class="heart-symbol" style="margin:0 .2em 0 0">&hearts;</span> Heart-healthy choices help to reduce the amount of sodium in your diet</td>
        <td colspan="2" class="notes-cell">We hope you enjoy all your meals with us. For any questions about the menu or your meals please see any member of dining services.</td>
      </tr>`;
    document.getElementById('menu-body').innerHTML = body;
  }

  // ---------------- WEEK CALCULATION ----------------
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

  function getCurrentWeek() {
    const anchor = startOfDay(new Date(CYCLE_ANCHOR + 'T00:00:00'));
    const today = startOfDay(new Date());
    const diffDays = Math.round((today - anchor) / 86400000);
    const diffWeeks = Math.floor(diffDays / 7);
    return (((diffWeeks % CYCLE_LENGTH) + CYCLE_LENGTH) % CYCLE_LENGTH) + 1;
  }

  function showDateRange() {
    const today = startOfDay(new Date());
    const sunday = new Date(today); sunday.setDate(today.getDate() - today.getDay());
    const saturday = new Date(sunday); saturday.setDate(sunday.getDate() + 6);
    const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    document.getElementById('date-display').textContent = `${fmt(sunday)} \u2013 ${fmt(saturday)}`;
  }

  // ---------------- CSV PARSER ----------------
  // Handles quoted fields containing commas, line breaks and doubled quotes,
  // plus the invisible BOM that Excel adds to the start of a CSV file.
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const rows = [];
    let row = [], field = '', inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some(v => v.trim() !== '')) rows.push(row);
        row = [];
      } else {
        field += c;
      }
    }
    row.push(field);
    if (row.some(v => v.trim() !== '')) rows.push(row);

    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || '').trim() === '' ? '' : r[i]);
      return obj;
    });
  }

  // ---------------- FILL THE CELLS ----------------
  function renderItem(line) {
    const div = document.createElement('div');
    div.className = 'item';
    // Turn the heart character into a red heart (handles both ❤ and ♥)
    const parts = line.split(/[\u2764\u2665]\uFE0F?/);
    parts.forEach((part, i) => {
      if (i > 0) {
        const heart = document.createElement('span');
        heart.className = 'heart-symbol';
        heart.textContent = '\u2665';
        div.appendChild(heart);
      }
      div.appendChild(document.createTextNode(i < parts.length - 1 ? part.trimEnd() + '\u00A0' : part));
    });
    return div;
  }

  async function loadMenu(week) {
    // clear all cells first so nothing stale remains
    document.querySelectorAll('.meal-cell').forEach(c => c.innerHTML = '');

    try {
      const response = await fetch('menu.csv?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const items = parseCSV(await response.text());

      items.filter(r => parseInt(r.Week, 10) === week).forEach(r => {
        const cell = document.getElementById(`cell-${r.Day.trim()}-${r.Meal.trim()}`);
        if (!cell) return;

        if (r.HolidayGif && r.HolidayGif.trim()) {
          const img = document.createElement('img');
          img.src = r.HolidayGif.trim();
          img.className = 'holiday-gif';
          img.alt = '';
          img.onerror = () => img.remove();
          cell.appendChild(img);
        }

        r.Item.split(/\r?\n/)
          .map(s => s.trim())
          .filter(s => s !== '')
          .forEach(line => cell.appendChild(renderItem(line)));
      });
    } catch (err) {
      console.error('Error loading menu.csv:', err);
    }

    document.getElementById('week-display').textContent = `Week ${week}`;
  }

  // ---------------- HIGHLIGHT TODAY ----------------
  function highlightToday() {
    document.querySelectorAll('.is-today').forEach(el => el.classList.remove('is-today'));
    const todayIndex = new Date().getDay(); // 0 = Sunday
    const key = DAYS[todayIndex][0];
    document.getElementById(`col-${key}`).classList.add('is-today');
    MEALS.forEach(m => document.getElementById(`cell-${key}-${m}`).classList.add('is-today'));
  }

  // ---------------- AUTO-FIT TEXT TO SCREEN ----------------
  // Starts with large text and shrinks until the whole menu fits.
  function fitToScreen() {
    const root = document.documentElement;
    const screen = document.getElementById('screen');
    const header = document.getElementById('header-bar');
    const table = document.getElementById('menu-table');
    const cs = getComputedStyle(screen);
    const available = screen.clientHeight
      - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
      - header.offsetHeight - parseFloat(getComputedStyle(header).marginBottom) - 6;

    let size = Math.min(34, window.innerHeight * 0.034);
    table.style.flex = '0 0 auto';
    table.style.height = 'auto';
    while (size > 10) {
      root.style.setProperty('--fs', size + 'px');
      if (table.offsetHeight <= available) break;
      size -= 0.5;
    }
    // let the table stretch to fill any leftover space
    table.style.flex = '1 1 auto';
    table.style.height = available + 'px';
  }

  // ---------------- ROTATION LOOP ----------------
  const wait = ms => new Promise(res => setTimeout(res, ms));
  const noteScreen = document.getElementById('note-screen');
  const noteImg = document.getElementById('note-img');
  let noteBroken = false;
  noteImg.onerror = () => { noteBroken = true; };

  function animateProgressBar(ms) {
    const bar = document.getElementById('progress-bar');
    bar.style.transition = 'none';
    bar.style.width = '100%';
    void bar.offsetWidth;
    bar.style.transition = `width ${ms}ms linear`;
    bar.style.width = '0%';
  }

  async function runForever() {
    buildTable();
    while (true) {
      showDateRange();
      await loadMenu(getCurrentWeek());   // reloads CSV every cycle, so edits on GitHub show up
      highlightToday();
      fitToScreen();

      noteScreen.style.display = 'none';
      animateProgressBar(MENU_SECONDS * 1000);
      await wait(MENU_SECONDS * 1000);

      if (!noteBroken) {
        noteScreen.style.display = 'block';
        await wait(NOTE_SECONDS * 1000);
      }
    }
  }

  window.addEventListener('resize', fitToScreen);
  runForever();
</script>

</body>
</html>
